<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Folder | Max Hemmerich</title>
  <meta name="description" content="Project page template for Max Hemmerich's portfolio.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#project-content">Skip to main content</a>

  <header class="taskbar" role="banner">
    <div class="taskbar-left">
      <a class="start-button" href="../index.html">[Back]</a>
      <div class="taskbar-title">PROJECT_FOLDER.exe</div>
    </div>
    <div class="taskbar-right">
      <span>[dir]</span>
      <span>Portfolio Project</span>
    </div>
  </header>

  <main id="project-content" class="folder-shell">
    <section class="window main-window" aria-labelledby="project-window-title">
      <div class="title-bar">
        <h1 id="project-window-title" class="title-bar-text">Project Folder</h1>
        <div class="title-bar-controls" aria-hidden="true">
          <span class="control-button">[-]</span>
          <span class="control-button">[+]</span>
          <span class="control-button">[X]</span>
        </div>
      </div>

      <div class="window-body">
        <div class="directory-bar">
          <p class="directory-path">C:\PORTFOLIO\PROJECTS\<span id="project-path">PROJECT</span></p>
        </div>

        <section class="content-panel">
          <p class="eyebrow">[open folder]</p>
          <h2 id="project-name">Project Name</h2>
          <p id="project-summary" class="lead">Project summary.</p>

          <div class="info-grid">
            <div class="info-card">
              <h3>Role</h3>
              <p id="project-role"></p>
            </div>
            <div class="info-card">
              <h3>Type</h3>
              <p id="project-type"></p>
            </div>
            <div class="info-card">
              <h3>Stack</h3>
              <p id="project-stack"></p>
            </div>
          </div>
        </section>

        <section class="content-panel">
          <h2>Overview</h2>
          <p id="project-overview"></p>
        </section>

        <section class="content-panel">
          <h2>What I Built</h2>
          <ul id="project-built" class="retro-list"></ul>
        </section>

        <section class="content-panel">
          <h2>Why It Mattered</h2>
          <ul id="project-impact" class="retro-list"></ul>
        </section>

        <section class="content-panel">
          <h2>Relevant Skills</h2>
          <div id="project-skills" class="skills-grid"></div>
        </section>

        <footer class="footer-bar">
          <a class="retro-button" href="../index.html">Return to Desktop</a>
        </footer>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const data = {
        "vibe-dashboard": {
          path: "VIBE_DASHBOARD",
          name: "VIBE Dashboard",
          summary: "HTML/CSS recruitment-metrics dashboard for study leadership, enabling self-serve monitoring.",
          role: "Built independently within CAMH research operations",
          type: "Internal dashboard / operational reporting",
          stack: "HTML, CSS, recruitment funnel design, KPI definition",
          overview: "This dashboard consolidated recruitment and study-performance monitoring into a self-serve interface for leadership. It translated operational questions into visible metrics for conversion, velocity, retention, and recruitment bottlenecks.",
          built: [
            "Built and independently shipped a multi-tab HTML dashboard using CAMH branding standards.",
            "Defined operational KPIs for recruitment funnel monitoring.",
            "Tracked conversion, velocity, retention, and participant drop-off patterns.",
            "Structured the interface for non-technical leadership use."
          ],
          impact: [
            "Improved visibility into recruitment performance.",
            "Reduced dependence on ad hoc reporting requests.",
            "Made study bottlenecks easier to identify and discuss.",
            "Supported leadership with self-serve monitoring instead of manual updates."
          ],
          skills: [
            "Dashboard development",
            "HTML/CSS",
            "Operational reporting",
            "Stakeholder reporting",
            "Recruitment analytics"
          ]
        },
        "coverage-gap-flow": {
          path: "TAY_COVERAGE_GAP_FLOW",
          name: "TAY Coverage Gap Flow",
          summary: "Power Automate flow that scans a shared Outlook calendar and surfaces research visits with no staff assigned.",
          role: "Independent workflow automation build",
          type: "Operations automation / scheduling support",
          stack: "Power Automate, Outlook calendar logic, Microsoft 365",
          overview: "This automation scanned a shared calendar and surfaced visits lacking assigned staff coverage. It focused on a high-volume scheduling problem in a live research environment with thousands of visit records annually.",
          built: [
            "Built a Power Automate flow to scan a shared calendar for unassigned visits.",
            "Applied logic for identifying scheduling gaps across high-volume research operations.",
            "Used Microsoft 365 ecosystem tools to support team workflow visibility.",
            "Reduced the need for manual calendar review."
          ],
          impact: [
            "Helped staff catch unassigned visits earlier.",
            "Reduced manual auditing work.",
            "Improved coverage reliability for high-volume visit operations.",
            "Made scheduling risks more visible."
          ],
          skills: [
            "Power Automate",
            "Scheduling automation",
            "Microsoft 365",
            "Operations analysis",
            "Workflow design"
          ]
        },
        "eeg-scheduling-flow": {
          path: "EEG_SCHEDULING_FLOW",
          name: "EEG Scheduling Flow",
          summary: "Power Automate workflow that replaced manual weekly availability-block creation for 4 EEG technicians.",
          role: "Independent workflow automation build",
          type: "Lab scheduling automation",
          stack: "Power Automate, Outlook, recurring workflow logic",
          overview: "This workflow automated a repetitive weekly scheduling task for EEG operations. It replaced manual block creation and standardized an otherwise fragile recurring process.",
          built: [
            "Automated weekly availability-block creation for EEG scheduling.",
            "Replaced a manual process used across 4 technicians.",
            "Set up recurring scheduling logic within Power Automate.",
            "Reduced repetitive admin work in a clinical-research support setting."
          ],
          impact: [
            "Saved recurring manual effort.",
            "Standardized technician scheduling setup.",
            "Reduced the chance of missed or inconsistent availability blocks.",
            "Improved repeatability in lab operations."
          ],
          skills: [
            "Power Automate",
            "Scheduling systems",
            "Process improvement",
            "Operations support",
            "Workflow standardization"
          ]
        },
        "retinal-oct-privacy": {
          path: "RETINAL_OCT_PRIVACY_UTILITY",
          name: "Retinal OCT Export Privacy Utility",
          summary: "Utility built to identify and remove patient-identifying fields from retinal OCT exports before research use.",
          role: "Working implementation in research environment",
          type: "Privacy / data handling utility",
          stack: "Health-data workflow logic, export review, de-identification support",
          overview: "This utility supported safer research use of retinal OCT exports by removing specified identifying fields before downstream handling. It reduced manual privacy-review steps in a regulated setting.",
          built: [
            "Built a utility to identify and remove patient-identifying fields from retinal OCT exports.",
            "Focused on reducing manual de-identification effort before research use.",
            "Aligned the workflow with practical privacy needs in a regulated environment.",
            "Supported cleaner downstream handling of imaging data."
          ],
          impact: [
            "Reduced manual privacy-review work.",
            "Lowered the risk of avoidable identifying data passing downstream.",
            "Improved consistency in export handling.",
            "Supported research workflow efficiency without bypassing privacy needs."
          ],
          skills: [
            "Privacy-aware workflow design",
            "Health data handling",
            "Operations support",
            "Compliance-minded process improvement",
            "Clinical research systems"
          ]
        },
        "chalk": {
          path: "CHALK",
          name: "Chalk",
          summary: "SMS habit tracker built with Google Apps Script, Twilio, and a Google Sheets backend.",
          role: "Self-directed project",
          type: "Automation / lightweight product experiment",
          stack: "Google Apps Script, Twilio, Google Sheets",
          overview: "Chalk is a lightweight habit-tracking project built around SMS interaction. The goal was to create a low-friction system that works through simple text-based input instead of a heavy app interface.",
          built: [
            "Built an SMS-based habit tracker using Google Apps Script and Twilio.",
            "Used Google Sheets as a lightweight backend for storing responses.",
            "Designed around low-friction habit logging through text messages.",
            "Explored automation patterns for simple personal-product workflows."
          ],
          impact: [
            "Demonstrated practical end-to-end automation thinking.",
            "Showed lightweight product design without overengineering.",
            "Used simple tools to create a usable interaction loop.",
            "Translated a behavioral workflow into a working system."
          ],
          skills: [
            "Google Apps Script",
            "Twilio",
            "Workflow automation",
            "Lightweight product design",
            "Systems thinking"
          ]
        },
        "beattheclose": {
          path: "BEATTHECLOSE",
          name: "BeatTheClose",
          summary: "NBA player-props analytics tool using Python for Kelly sizing, expected-value calculations, and CLV tracking.",
          role: "Self-directed analytics project",
          type: "Quantitative analysis / decision support",
          stack: "Python, EV calculation, Kelly sizing, CLV tracking",
          overview: "BeatTheClose is a sports analytics project focused on quantifying betting edges and tracking whether decisions outperform the market close. It was built as a practical way to apply probabilistic thinking and structured decision rules.",
          built: [
            "Built a Python-based player-props analysis workflow.",
            "Calculated expected value and Kelly sizing for candidate bets.",
            "Tracked closing-line value as a feedback signal.",
            "Structured the project around repeatable quantitative rules rather than intuition."
          ],
          impact: [
            "Demonstrated applied probability and quantitative decision logic.",
            "Showed comfort building repeatable analysis workflows in Python.",
            "Created a framework for evaluating decisions against later market movement.",
            "Turned a personal interest into a measurable analytics exercise."
          ],
          skills: [
            "Python",
            "Quantitative analysis",
            "Expected value modeling",
            "Kelly sizing",
            "Performance tracking"
          ]
        },
        "postgres-powerbi": {
          path: "POSTGRESQL_POWERBI_PROJECT",
          name: "PostgreSQL + Power BI Portfolio Project",
          summary: "Portfolio project moving relational data through PostgreSQL into a Power BI dashboard to practise BI and data-warehousing concepts.",
          role: "Self-directed BI practice project",
          type: "Business intelligence / portfolio build",
          stack: "PostgreSQL, SQL, Power BI, relational modeling",
          overview: "This project was built to strengthen business-intelligence fundamentals by moving relational data through PostgreSQL into a Power BI reporting layer. It focused on hands-on practice with querying, modeling, and dashboard output.",
          built: [
            "Built a project pipeline from PostgreSQL into Power BI.",
            "Practised relational querying and basic data modeling concepts.",
            "Used the project to build familiarity with BI reporting workflows.",
            "Connected storage, transformation, and visualization in one portfolio piece."
          ],
          impact: [
            "Strengthened practical BI foundations.",
            "Created a visible portfolio piece for analytics-oriented roles.",
            "Demonstrated initiative in building technical skills outside day-to-day work.",
            "Connected SQL practice with dashboard output."
          ],
          skills: [
            "SQL",
            "PostgreSQL",
            "Power BI",
            "Data modeling",
            "Business intelligence"
          ]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const key = params.get("project") || "vibe-dashboard";
      const project = data[key] || data["vibe-dashboard"];

      document.title = project.name + " | Max Hemmerich";
      document.getElementById("project-path").textContent = project.path;
      document.getElementById("project-name").textContent = project.name;
      document.getElementById("project-summary").textContent = project.summary;
      document.getElementById("project-role").textContent = project.role;
      document.getElementById("project-type").textContent = project.type;
      document.getElementById("project-stack").textContent = project.stack;
      document.getElementById("project-overview").textContent = project.overview;

      const builtList = document.getElementById("project-built");
      const impactList = document.getElementById("project-impact");
      const skillsWrap = document.getElementById("project-skills");

      project.built.forEach(function (item) {
        const li = document.createElement("li");
        li.textContent = item;
        builtList.appendChild(li);
      });

      project.impact.forEach(function (item) {
        const li = document.createElement("li");
        li.textContent = item;
        impactList.appendChild(li);
      });

      project.skills.forEach(function (item) {
        const div = document.createElement("div");
        div.className = "skill-box";
        div.textContent = item;
        skillsWrap.appendChild(div);
      });
    }());
  </script>
</body>
</html>
